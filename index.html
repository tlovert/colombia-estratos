  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=DM+Sans:wght@300;400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;

  #colombia-preview {
    --bog: #2D4A3E;

  }

* { box-sizing: border-box; margin: 0; padding: 0; }

#colombia-preview {
font-family: &#x27;DM Sans&#x27;, sans-serif;
background: var(--cream);
color: var(--ink);

}

.masthead {

position: relative;
overflow: hidden;
}

.masthead::before {
content: &#x27;ESTRATOS&#x27;;
position: absolute;
right: -20px;
top: 50%;
transform: translateY(-50%);
font-family: &#x27;Playfair Display&#x27;, serif;
font-size: 120px;
color: rgba(0,0,0,0.04);
letter-spacing: -4px;
pointer-events: none;
white-space: nowrap;
}

.eyebrow {
font-size: 10px;
font-weight: 500;
letter-spacing: .18em;
text-transform: uppercase;

margin-bottom: 10px;
}

h1 {
font-family: &#x27;Playfair Display&#x27;, serif;

h1 em {

}

.subtitle {

}

/* City selector */
.city-nav {
display: flex;
border-bottom: 1.5px solid var(--ink);
}

.city-btn {
flex: 1;
padding: 16px 20px;
border: none;
background: none;
cursor: pointer;
font-family: &#x27;DM Sans&#x27;, sans-serif;

font-weight: 500;
letter-spacing: .05em;

}

.city-btn:last-child { border-right: none; }

.city-btn .city-label {
display: block;
font-size: 16px;
font-family: &#x27;Playfair Display&#x27;, serif;
font-weight: 600;
margin-bottom: 2px;
}

.city-btn .city-desc {
font-size: 10px;
font-weight: 300;
letter-spacing: .08em;

}

.city-btn.active-bog { background: var(--bog-light); color: var(--bog); border-bottom: 3px solid var(--bog); margin-bottom: -2px; }
.city-btn.active-med { background: var(--med-light); color: var(--med); border-bottom: 3px solid var(--med); margin-bottom: -2px; }
.city-btn.active-car { background: var(--car-light); color: var(--car); border-bottom: 3px solid var(--car); margin-bottom: -2px; }

/* Estrato header row */
.estrato-header {
display: grid;
grid-template-columns: 160px 1fr 1fr 1fr;

}

.estrato-header-blank { padding: 14px 20px; }

.estrato-col-head {

}

.estrato-num {

font-size: 28px;
font-weight: 600;
line-height: 1;
margin-bottom: 3px;
}

.estrato-label {
font-size: 10px;
letter-spacing: .12em;
text-transform: uppercase;
opacity: .6;
font-weight: 300;
}

/* Table */
.table-#colombia-preview { display: none; }
.table-body.active { display: block; }

.row {
display: grid;
grid-template-columns: 160px 1fr 1fr 1fr;
border-bottom: 1px solid rgba(0,0,0,0.07);
transition: background .15s;
}

.row:hover { background: rgba(0,0,0,0.02); }

.row-label {
padding: 20px 20px;
font-size: 10px;
font-weight: 500;
letter-spacing: .1em;

align-items: flex-start;

}

.cell {
padding: 18px 20px;
border-left: 1px solid rgba(0,0,0,0.07);

font-weight: 300;
}

.cell b {
font-weight: 500;
color: var(--ink);
}

.cell .tag {
display: inline-block;
font-size: 10px;
font-weight: 500;
letter-spacing: .06em;
padding: 2px 8px;
border-radius: 2px;
margin-bottom: 6px;
text-transform: uppercase;
}

.tag-bog { background: var(--bog-light); color: var(--bog); }
.tag-med { background: var(--med-light); color: var(--med); }
.tag-car { background: var(--car-light); color: var(--car); }

.cell .pill {
display: inline-block;
font-size: 10px;
padding: 1px 7px;
border-radius: 10px;
margin: 2px 2px 2px 0;
font-weight: 400;
}

/* Row accent stripes by estrato */
.row .cell:nth-child(2) { border-left: 3px solid var(--e4); }
.row .cell:nth-child(3) { border-left: 3px solid var(--e5); }
.row .cell:nth-child(4) { border-left: 3px solid var(--e6); }

/* Section dividers */
.section-break {
display: grid;
grid-template-columns: 160px 1fr;
background: var(--ink);
color: var(--cream);
padding: 8px 20px 8px 20px;
font-size: 9px;
font-weight: 500;
letter-spacing: .2em;
text-transform: uppercase;
opacity: .9;
}

/* Meters */
.meter {
display: flex;
align-items: center;
gap: 7px;
margin: 5px 0;
font-size: 11px;
color: var(--muted);
}
.meter-track {
flex: 1;
height: 4px;
background: rgba(0,0,0,0.08);

overflow: hidden;
}
.meter-fill { height: 100%; border-radius: 2px; }

/* Footer */
.footer {
padding: 24px 40px;

font-size: 11px;
color: var(--muted);
line-height: 1.7;

gap: 40px;
}

.legend-item {
display: flex;
align-items: center;
gap: 6px;
}

.legend-dot {
width: 10px;
height: 10px;
border-radius: 1px;
flex-shrink: 0;
}

@media (max-width: 700px) {

.cell { padding: 14px 10px; font-size: 12px; }

&lt;div id=&quot;table-bog&quot; class=&quot;table-body active&quot;&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Neighbourhood&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Where you live&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;span class=&quot;tag tag-bog&quot;&gt;E4&lt;/span&gt;&lt;br&gt;&lt;b&gt;Chapinero, Teusaquillo, Barrios Unidos, parts of Suba.&lt;/b&gt; Solid apartment buildings, tree-lined streets, walkable. Professionals, academics, NGO workers. You have a doorman but not a driver.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;span class=&quot;tag tag-bog&quot;&gt;E5&lt;/span&gt;&lt;br&gt;&lt;b&gt;Chicó, Cedritos, Santa Bárbara.&lt;/b&gt; Larger apartments or houses, gated buildings with gym and pool. Corporate executives, established professionals. Quiet residential streets.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;span class=&quot;tag tag-bog&quot;&gt;E6&lt;/span&gt;&lt;br&gt;&lt;b&gt;Rosales, La Cabrera, Country Club, La Calleja.&lt;/b&gt; Houses or very large penthouses. Some of the most expensive real estate in Latin America. Old money. The families here have been here for generations.&lt;/div&gt;

    &lt;div class=&quot;row-label&quot;&gt;Everyday dress&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Smart casual, dark palette.&lt;/b&gt; Well-cut jeans or chinos, quality leather shoes or clean white sneakers, a good overcoat. No logos visible. Wool or cashmere for cold mornings. Intentional but not studied — looks effortless because it&#x27;s not trying hard.&lt;/div&gt;

    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;Restaurant in Chicó: blazer required. Women dress elegantly — tailored, not revealing. The meal is at a place that doesn&#x27;t need to advertise itself. Wine knowledge matters. Reservations are made a week in advance.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Private club or home dinner in Rosales. Formal without being showy. Men in suits or sport coats. Women in understated elegance. The event itself is probably not public — E6 Bogotá socializes privately.&lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Social life &amp; culture&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Social world&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Intellectual and activist-adjacent.&lt;/b&gt; Book clubs, film screenings, weekend hikes to Monserrate, craft coffee, gallery openings in La Macarena. University friendships are the social core. Politics discussed constantly — often from a progressive or critical angle.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;b&gt;Professional networks.&lt;/b&gt; Socializing happens in restaurants, country clubs, and corporate events. Children at bilingual private schools (Liceo Francés, Colegio Anglo Colombiano). Weekend trips to Melgar or the coffee region. Tennis, cycling.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;b&gt;Closed circles.&lt;/b&gt; The same 200 families, for generations. Club Los Lagartos or El Nogal. Board memberships, foundations, political connections. These are the 932 people who run the country — most live here.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Weekend&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;Sunday ciclovía — biking through 120km of car-free streets. Brunch in Usaquén. The &lt;i&gt;El Tiempo&lt;/i&gt; or &lt;i&gt;Semana&lt;/i&gt; read over coffee. Maybe a protest or a cultural festival in the afternoon.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;Drive to La Calera or Guasca for a country house lunch. Sunday lunch is still important but more private. Golf. Kids at riding lessons or tennis.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Country house (finca) outside the city — every E6 family has one. Weekend entirely off the grid from public life. The domestic staff travels with them.&lt;/div&gt;
  &lt;/div&gt;

&lt;!-- MEDELLÍN --&gt;

&lt;div id=&quot;table-med&quot; class=&quot;table-body&quot;&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Neighbourhood&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Where you live&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;span class=&quot;tag tag-med&quot;&gt;E4&lt;/span&gt;&lt;br&gt;&lt;b&gt;Laureles, Estadio, Belén.&lt;/b&gt; Clean residential streets, family-oriented, well-maintained apartment buildings. Middle management, teachers, small business owners. The &quot;real Medellín&quot; that expats rarely see — dignified, tight-knit, paisa to the core.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;span class=&quot;tag tag-med&quot;&gt;E5&lt;/span&gt;&lt;br&gt;&lt;b&gt;El Poblado (upper sections), Los Balsos, Santa María de los Ángeles.&lt;/b&gt; Large apartments and houses behind walls and gates. Well-connected professionals, business owners. The same streets where upscale restaurants and boutiques line up.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;span class=&quot;tag tag-med&quot;&gt;E6&lt;/span&gt;&lt;br&gt;&lt;b&gt;El Tesoro, Las Palmas corridor, Envigado (upper).&lt;/b&gt; Sprawling houses on the hills above the valley. Views over the entire city. The GEA (Grupo Empresarial Antioqueño) families, cattle ranchers, old industrial wealth.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Dress — Daily&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Everyday dress&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Polished and put-together, with visible effort.&lt;/b&gt; Medellín dresses up more than Bogotá at this level — jeans are always skinny or straight-cut and pristine, shoes are clean, hair is done. No one leaves the house looking casual. The climate (eternal spring at 22°C) permits year-round attention to appearance.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;b&gt;Brand-conscious but not aggressive.&lt;/b&gt; Tommy Hilfiger, Ralph Lauren, local premium brands like Studio F or Vélez leather. Fitted everything. Medellín at E5 dresses to be seen — Saturday afternoon at the Centro Comercial El Tesoro is a fashion parade. Appearance signals success and faith in the paisa dream.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;b&gt;Conservative wealth display.&lt;/b&gt; Quality is paramount but so is social correctness — too flashy reads as narco-adjacent and is carefully avoided. Good Italian shoes, a discreet Swiss watch, linen shirt. The GEA families dress like 1980s Milanese industrialists — prosperous but not showy. Old hacienda sensibility.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Dress — Evening / Social&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Going out&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;Dinner in Laureles or Parque El Poblado: clean jeans, collared shirt, leather shoes. Women: carefully assembled outfit — not too revealing for E4 sensibilities, but fashionable. Looking presentable is a social obligation, not a choice.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;El Poblado restaurant strip or a lounge bar: blazer or fitted shirt, dark trousers, good shoes. Women dressed up fully — Medellín&#x27;s E5 nightlife is image-intense. The bar scene here is the most glamorous in Colombia outside of Bogotá&#x27;s private clubs.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Private club (Club Campestre, Club el Rodeo) or a home asado. Formal but relaxed — paisa hospitality is warm even at the top. Men in guayaberas or blazers. Sundays at the club involve children, extended family, tennis, and a long lunch. The family is the event.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Social life &amp; culture&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Social world&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Family-centered, neighborhood-rooted.&lt;/b&gt; Friends are often childhood friends or cousins. Sunday lunch at the parents&#x27; house is non-negotiable. The extended family functions as a social safety net and social calendar simultaneously. Community is tight; outsiders warm but observed.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;b&gt;Business networks over intellectual ones.&lt;/b&gt; EAFIT or UPB graduates. Association through business, not ideas. Uribe politics are dinner-table consensus — challenging it would be socially awkward. The entrepreneurial success story is the cultural script everyone is performing.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;b&gt;Paisa dynasty logic.&lt;/b&gt; The GEA conglomerate is run by the same 30 or 40 extended families who intermarry and cross-hold shares. Social life is inseparable from economic life. The Club Campestre is where deals are made. Catholic faith is genuine and central — not performative.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Weekend&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;Saturday shopping in Laureles, Sunday Mass then family lunch. Feria de las Flores in August is the year&#x27;s social apex. Hiking in Parque Arví with friends. Coffee on the terrace. The metro to El Centro for the market.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;Finca (country house) in Santa Elena or El Retiro. Drive up Friday night, return Sunday. The finca is the ultimate status symbol here — even a modest one. Horse riding, BBQ, children playing on grass.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Larger finca, probably in Rionegro or near El Peñol. Extended family gatherings. Possibly a ranch as well. The family is the institution. Religion is real — Mass on Sunday, not perfunctory.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Wealth indicators&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Money signals&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Family name&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:75%;background:var(--med)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Church attendance&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:85%;background:var(--med)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Business network&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:90%;background:var(--med-mid)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Brand display&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:65%;background:var(--med-mid)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Finca ownership&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:80%;background:var(--med-mid)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;GEA ties&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:95%;background:var(--e6)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Brand display&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:15%;background:var(--e6)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Hacienda culture&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:92%;background:var(--e6)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- CARTAGENA --&gt;

&lt;div id=&quot;table-car&quot; class=&quot;table-body&quot;&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Neighbourhood&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Where you live&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;span class=&quot;tag tag-car&quot;&gt;E4&lt;/span&gt;&lt;br&gt;&lt;b&gt;Manga, Pie de la Popa, El Cabrero.&lt;/b&gt; Older residential neighborhoods close to the historic center. Civil servants, teachers, established merchant families. The city&#x27;s professional middle class — dignified, local, not tourist-facing. Far from the gloss of Bocagrande.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;span class=&quot;tag tag-car&quot;&gt;E5&lt;/span&gt;&lt;br&gt;&lt;b&gt;Bocagrande, Castillogrande, parts of Manga.&lt;/b&gt; High-rise apartments with sea views, doormen, pools. Lebanese merchant families, regional business owners, politicians. The most &quot;see and be seen&quot; register in the city.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;span class=&quot;tag tag-car&quot;&gt;E6&lt;/span&gt;&lt;br&gt;&lt;b&gt;Marbella, El Laguito, Barú island, restored walled city palaces.&lt;/b&gt; Either a tower penthouse or a restored colonial palace in the Centro Histórico. Old Cartagena families, Bogotá elite with vacation properties, foreign investors. Where the Art Basel Cartagena crowd stays.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Dress — Daily&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Everyday dress&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Casual, bright, heat-appropriate.&lt;/b&gt; Light linen or cotton trousers, guayabera or loose button-down, sandals or leather loafers. The heat (32°C every day) makes heavy dressing impossible. Color is welcome — pastels, white, turquoise. Costeño style is relaxed without being sloppy.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;b&gt;Resort-smart meets merchant-class flair.&lt;/b&gt; White linen is the uniform. Women in flowing dresses or structured separates in cream or bright colors. Gold jewelry — real gold, substantial pieces — is standard and visible. Bocagrande dresses to impress at the beach club as much as at dinner.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;b&gt;International resort elite.&lt;/b&gt; Hermès sandals, Italian linen, a tan that comes from actually owning beach property not from vacation. Unbranded but clearly expensive. At this level in Cartagena, the city mixes Colombian old money with Bogotá&#x27;s top families summering here, and European or American real-estate money.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Dress — Evening / Social&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Going out&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;Dinner in Getsemaní or a local seafood restaurant — linen shirt, clean slacks, leather sandals. Women in a light dress. The food is the event. Vallenato playing somewhere nearby. Easy, warm, genuine.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;Club de Pesca or a rooftop in the walled city. White linen outfit or flowing dress. Gold jewelry. Cumbia or champeta on the playlist. Bocagrande socialites dress extravagantly — the coast has no instinct toward restraint. Color, gold, and body are celebrated here in a way Bogotá would find excessive.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Private dinner in a colonial palace or on a yacht in the bay. Understated international elegance — these circles include more foreigners than any other E6 context in Colombia. Art Cartagena events, private film screenings during Hay Festival, the Cartagena Film Festival circuit.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Social life &amp; culture&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Social world&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;&lt;b&gt;Community-rooted, historically grounded.&lt;/b&gt; Deep local networks — the same families have been in Manga or El Cabrero for generations. Bolívar&#x27;s E4 class is often mixed-race and proud of it. Politics is pragmatic: who will fix the water, the roads. Carnival is the year&#x27;s cultural apex — everyone, every class, participates.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;&lt;b&gt;Merchant class display.&lt;/b&gt; Lebanese-Colombian families dominate much of Bocagrande commerce. Social life is visible — beach clubs, rooftop bars, the Malecón promenade. Wealth is shown more openly than in Bogotá. It feels South American Mediterranean: expressive, warm, celebratory.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;&lt;b&gt;Colombia meets the international jet set.&lt;/b&gt; The walled city E6 scene is the most cosmopolitan in Colombia — more international than Bogotá&#x27;s old money. Hay Festival (Colombia&#x27;s answer to Davos-meets-literature) brings the global intellectual and political class here every January. Real estate prices rival Miami.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Weekend&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;Saturday at the public beach or Bocagrande beach club. Fried fish, coconut rice, cold beer. Sunday still Catholic — Mass, then extended family lunch at home. Carnival season (February) is four days of total suspension of normal life.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;Day trip to Islas del Rosario by private boat. Beach club. Sunday lunch at Club de Pesca — the Cartagena equivalent of the Medellín Club Campestre. Gold jewelry even at the beach. The sea is the E5 weekend backdrop.&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 6&quot;&gt;Private island or Barú property. International guests visiting. The lifestyle here in high season is indistinguishable from St. Barts or Ibiza — except with vallenato instead of house music, and far better food.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-break&quot;&gt;&lt;span&gt;Wealth indicators&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;row-label&quot;&gt;Money signals&lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 4&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Local roots&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:88%;background:var(--car)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Gold jewelry&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:55%;background:var(--car)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Carnival role&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:80%;background:var(--car)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell&quot; data-estrato=&quot;Estrato 5&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Sea access&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:85%;background:var(--car-mid)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span style=&quot;width:90px&quot;&gt;Gold / jewelry&lt;/span&gt;&lt;div class=&quot;meter-track&quot;&gt;&lt;div class=&quot;meter-fill&quot; style=&quot;width:90%;background:var(--car-mid)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
